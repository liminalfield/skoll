[package]
name = "skoll"
version = "0.1.0"
edition = "2021"
authors = ["Oluf Andrews <oluf@oandrews.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/liminalfield/skoll"
description = "Video sync for scoring to picture in Bitwig on Linux"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
libc = "0.2.190"
# nih-plug has no stable release. Pin the commit to avoid API drift.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.7"

[profile.release]
lto = "thin"
strip = "symbols"
