[package]
name = "skoll"
version = "0.2.0"
edition = "2021"
authors = ["Oluf Andrews <oluf@oandrews.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/liminalfield/skoll"
description = "Video sync for scoring to picture in Bitwig on Linux"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
libc = "0.2.190"
# nih-plug has no stable release. Pin the commit to avoid API drift. The liminalfield fork
# adds ProcessContext::mark_state_dirty() and host editor resizing (branch skoll), see
# docs/spec.md.
nih_plug = { git = "https://github.com/liminalfield/nih-plug.git", rev = "34a4d3aeacde478a017c7542f62dc590722526a3", features = ["assert_process_allocs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.7"

[profile.release]
lto = "thin"
strip = "symbols"
